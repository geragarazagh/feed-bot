[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-feed"
version = "0.1"
description = "A Telegram bot that sends new posts of chosen public channels as links with previews"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.scripts]
feedbot = "tgfeed.__main__:run"
feedbot-admin = "tgfeed.admin:main"

[tool.setuptools]
packages = ["tgfeed"]
